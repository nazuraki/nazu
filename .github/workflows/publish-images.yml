# Publishes container images for the server-deployable apps to GHCR.
# Runs on every push to main (`latest` + `sha-<short>` tags) and on version
# tags (`vX.Y.Z` → semver tags).
#
# Only images whose inputs changed are published: a `changes` job diffs the
# push range and emits the matrix. Tag pushes (and pushes where the base
# commit is unknown, e.g. force pushes) publish everything.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]

# One publish run per ref at a time; superseded main pushes are cancelled.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Decide which images need publishing based on what the push touched.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute changed images
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Path prefixes that feed each image (see each app's Dockerfile).
          # Root workspace files feed every pnpm-built image; this workflow
          # file itself rebuilds everything when it changes.
          shared="package.json pnpm-workspace.yaml pnpm-lock.yaml .github/workflows/publish-images.yml"
          web_paths="$shared apps/web/ packages/ui/ infra/postgres/migrations/"
          discord_paths="$shared apps/discord/"
          backplane_paths="$shared apps/backplane/"
          graphiti_paths="apps/graphiti/ .github/workflows/publish-images.yml"

          all_images=(web discord graphiti backplane)

          publish_all() {
            echo "Publishing all images: $1"
            selected=("${all_images[@]}")
          }

          before="${{ github.event.before }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            publish_all "tag push"
          elif [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "$before" 2>/dev/null; then
            publish_all "base commit unknown"
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
            echo "Changed files:"; echo "$changed"
            selected=()
            for image in "${all_images[@]}"; do
              paths_var="${image}_paths"
              for prefix in ${!paths_var}; do
                while IFS= read -r f; do
                  if [[ "$f" == "$prefix"* ]]; then
                    selected+=("$image")
                    break 2
                  fi
                done <<<"$changed"
              done
            done
          fi

          entry() {
            case "$1" in
              web)       echo '{"image":"nazu-web","context":".","dockerfile":"apps/web/Dockerfile"}' ;;
              discord)   echo '{"image":"nazu-discord","context":".","dockerfile":"apps/discord/Dockerfile"}' ;;
              graphiti)  echo '{"image":"nazu-graphiti","context":"apps/graphiti","dockerfile":"apps/graphiti/Dockerfile"}' ;;
              backplane) echo '{"image":"nazu-backplane","context":".","dockerfile":"apps/backplane/Dockerfile"}' ;;
            esac
          }

          include="[]"
          for image in ${selected[@]+"${selected[@]}"}; do
            include=$(jq -c --argjson e "$(entry "$image")" '. + [$e]' <<<"$include")
          done

          echo "Selected: ${selected[*]:-none}"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          if [[ "$include" == "[]" ]]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # main → latest + sha-<short>; v-tags → semver (+ latest via semver).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
