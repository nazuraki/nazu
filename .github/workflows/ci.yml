name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: pip install -r apps/mcp/requirements-dev.txt
      - name: Lint
        run: ruff check apps/mcp

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @nazu/web lint
      - name: Type-check
        run: pnpm --filter @nazu/web check
