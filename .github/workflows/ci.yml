name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: pip install -r apps/mcp/requirements-dev.txt
      - name: Lint
        run: ruff check apps/mcp

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync SvelteKit types
        run: pnpm --filter @nazu/web run sync
      - name: Lint
        run: pnpm --filter @nazu/web run lint
      - name: Type-check
        run: pnpm --filter @nazu/web run typecheck

  test-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run functional tests
        run: pnpm --filter @nazu/tests-functional test
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p nazu-test -f docker-compose.yml -f docker-compose.test.override.yml logs --no-color || true
      - name: Tear down stack
        if: always()
        run: |
          docker compose -p nazu-test -f docker-compose.yml -f docker-compose.test.override.yml down -v --remove-orphans || true
