name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: pip install -r apps/mcp/requirements-dev.txt
      - name: Lint
        run: ruff check apps/mcp

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync SvelteKit types
        run: pnpm --filter @nazu/web run sync
      - name: Debug sync output
        run: |
          echo "=== .svelte-kit contents ==="
          ls -la apps/web/.svelte-kit/ || echo "MISSING"
          echo "=== generated tsconfig ==="
          cat apps/web/.svelte-kit/tsconfig.json || echo "MISSING"
          echo "=== root tsconfig ==="
          cat apps/web/tsconfig.json
          echo "=== src/lib contents ==="
          ls apps/web/src/lib/ || echo "MISSING"
      - name: Lint
        run: pnpm --filter @nazu/web run lint
      - name: Type-check
        run: pnpm --filter @nazu/web run typecheck
