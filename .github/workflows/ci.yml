name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Sync SvelteKit types
        run: pnpm --filter @nazu/web run sync
      - name: Lint
        run: pnpm --filter @nazu/web run lint
      - name: Type-check
        run: pnpm --filter @nazu/web run typecheck
      - name: Unit tests
        run: pnpm --filter @nazu/web run test
      - name: Discord sidecar type-check
        run: pnpm --filter @nazu/discord run check
      - name: Discord sidecar unit tests
        run: pnpm --filter @nazu/discord run test

  test-functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run functional tests
        run: pnpm --filter @nazu/tests-functional test
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p nazu-test -f docker-compose.yml -f docker-compose.test.override.yml logs --no-color || true
      - name: Tear down stack
        if: always()
        run: |
          docker compose -p nazu-test -f docker-compose.yml -f docker-compose.test.override.yml down -v --remove-orphans || true

  # Optional/heavy pieces (the Graphiti sidecar). Gated on the core suite so we
  # don't pay the heavy Python image build unless lint/typecheck/unit + the
  # functional stack are green — but we still exercise everything we can without
  # secrets: the FastAPI contract, that the image builds, and that it boots.
  # The live Anthropic + Ollama + FalkorDB round-trip needs secrets/an embeddings
  # server and stays a manual smoke test.
  test-optional:
    runs-on: ubuntu-latest
    needs: [lint-web, test-functional]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sidecar contract tests
        run: |
          cd apps/graphiti
          python -m pip install --quiet fastapi 'pydantic>=2.7' pytest httpx
          pytest -q
      - name: Build + boot the Graphiti sidecar (health-gated)
        # --no-deps: /health needs no FalkorDB, and skipping it avoids publishing
        # falkordb's host ports (which can collide). This proves the image builds
        # and the app imports + serves; real graph ops need secrets (manual).
        run: docker compose -p nazu-optional --profile graph up -d --build --wait --no-deps graphiti
      - name: Build the Discord sidecar image
        # No live deps to boot against here; just prove the image builds (its
        # pure logic is covered by the unit tests in lint-web).
        run: docker compose -p nazu-optional --profile discord build discord
      - name: Sidecar logs on failure
        if: failure()
        run: docker compose -p nazu-optional --profile graph logs --no-color graphiti || true
      - name: Tear down
        if: always()
        run: docker compose -p nazu-optional --profile graph down -v --remove-orphans || true
