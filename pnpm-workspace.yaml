packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/*'

onlyBuiltDependencies:
  - esbuild

# Overrides for transitive deps whose parents pin vulnerable ranges
# (Dependabot alerts; remove when parents catch up):
# - serialize-javascript: @rollup/plugin-terser@0.4.x pins ^6 (GHSA via alerts #2, #25)
# - uuid: dockerode@4 pins ^10 (alert #24)
# - cookie: @sveltejs/kit pins ^0.6.0 (alert #1)
overrides:
  '@vite-pwa/sveltekit>vite': ^6.0.0
  serialize-javascript: ^7.0.5
  uuid: ^11.1.1
  cookie: ^0.7.0
