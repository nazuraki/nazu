# Cloudflare Tunnel — Docker Compose mode (current)
#
# The tunnel runs as a `cloudflared` service in docker-compose.yml.
# All ingress config (public hostnames → origin) is managed in the CF dashboard:
#   Zero Trust → Networks → Tunnels → your tunnel → Public Hostnames
#
# Origin URL must be: http://web:3000  (Docker service name, not localhost)
#
# Required env var in .env:
#   CF_TUNNEL_TOKEN=<token from CF dashboard "Install connector" page>
#
# ─────────────────────────────────────────────────────────────────────
# Legacy host-daemon config (pre-Docker) — kept for reference only
# ─────────────────────────────────────────────────────────────────────
# tunnel: <TUNNEL_ID>
# credentials-file: /home/<USER>/.cloudflared/<TUNNEL_ID>.json
#
# ingress:
#   - hostname: <YOUR_DOMAIN>
#     service: http://localhost:3000
#   - service: http_status:404
