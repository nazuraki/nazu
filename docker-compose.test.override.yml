services:
  web:
    environment:
      NODE_ENV: test
      GITHUB_API_BASE_URL: http://mocks:8080/github
      PERSONAL_GITHUB_TOKEN: test-personal-token
      LOREARC_GITHUB_TOKEN: test-org-token
      GITHUB_USER: testuser
      GITHUB_ORG: testorg
    ports: !override
      - "3001:3000"
    depends_on:
      - postgres
      - mocks

  postgres:
    ports: !override
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazu -d nazu"]
      interval: 2s
      timeout: 3s
      retries: 20

  falkordb:
    ports: !override
      - "6381:6379"
      - "7689:7687"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mocks:
    build:
      context: ./tests/functional/mocks
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:8080/__admin__/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
