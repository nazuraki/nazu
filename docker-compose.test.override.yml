services:
  web:
    environment:
      # GitHub config is seeded into the DB (app_settings) by global-setup.ts;
      # the AI key is omitted on purpose (ingest falls back when unset).
      NODE_ENV: test
      DATABASE_URL: postgres://nazu:nazu@postgres:5432/nazu
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: nazu-documents-test
    ports: !override
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mocks:
        condition: service_healthy

  postgres:
    ports: !override
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nazu -d nazu"]
      interval: 2s
      timeout: 3s
      retries: 20

  caddy:
    ports: !override
      - "8443:443"

  minio:
    ports: !override
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  falkordb:
    ports: !override
      - "6381:6379"
      - "7689:7687"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  mocks:
    build:
      context: ./tests/functional/mocks
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:8080/__admin__/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
