# usr — centralized user management. Its own compose project (like the
# backplane), deployable by the backplane with
# composeFiles: ["apps/usr/docker-compose.yml"].
services:
  usr:
    image: ghcr.io/nazuraki/nazu-usr:latest
    build:
      context: ../..
      dockerfile: apps/usr/Dockerfile
    # Loopback-only: plain HTTP stays available on the host for local dev.
    # LAN/public clients come in through the shared edge (switchboard), which
    # reaches `usr:8432` over the external `edge` network — see
    # docker-compose.edge.yml.
    ports:
      - "127.0.0.1:8432:8432"
    # No app env: API keys are DB-backed and role-mapped, created in the Keys
    # UI. Open mode lasts only until first-run setup creates the admin.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: usr
      POSTGRES_DB: usr
    volumes:
      # postgres:18+ stores data in a version-specific subdir, so the volume is
      # mounted at the parent (/var/lib/postgresql), not /…/data as on ≤16.
      - usr_postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped

volumes:
  usr_postgres_data:
