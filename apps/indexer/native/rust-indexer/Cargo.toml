[package]
name = "rust-indexer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-indexer"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
cargo_metadata = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
