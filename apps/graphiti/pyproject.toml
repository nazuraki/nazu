[project]
name = "nazu-graphiti"
version = "0.1.0"
description = "Thin FastAPI sidecar wrapping graphiti-core for nazu's temporal-knowledge recall"
requires-python = ">=3.10"
dependencies = [
    # Upper-bounded: graphiti-core's import surface shifts between minors
    # (0.29 started importing httpx without declaring it). Bump deliberately.
    "graphiti-core[falkordb,anthropic]>=0.29,<0.30",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
