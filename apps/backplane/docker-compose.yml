# The backplane's own compose project — deliberately SEPARATE from any stack it
# manages (it can't be updated by the thing it updates). On the server, run it
# from the published image (`just backplane-update`, i.e. pull + up -d); for
# local dev, `just backplane-up` builds from source.
#
# Self-update: the "Update backplane" button in the UI, `POST /api/self/update`,
# or the MCP `self_update` tool — each spawns a detached helper container that
# pulls + `up -d`'s this stack from outside, so it survives the backplane's own
# recreation. `just backplane-update` / re-running install.sh still work too.
services:
  backplane:
    image: ghcr.io/nazuraki/nazu-backplane:latest
    build:
      context: ../..
      dockerfile: apps/backplane/Dockerfile
    # Loopback-only: plain HTTP stays available on the host for local dev, but
    # LAN clients go through caddy (HTTPS on 8443, tls profile).
    ports:
      - "127.0.0.1:8430:8430"
    environment:
      # Static bearer key for agents/MCP. The API is open only when this is
      # empty AND no local admin account is set in the UI (Settings).
      BACKPLANE_API_KEY: ${BACKPLANE_API_KEY:-}
      # Image digest poll interval in seconds; 0 disables the poller.
      BACKPLANE_POLL_INTERVAL: ${BACKPLANE_POLL_INTERVAL:-300}
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      # Read-write: the backplane starts/stops containers in target stacks.
      - /var/run/docker.sock:/var/run/docker.sock
      # Registry DB + per-project git checkouts.
      - backplane_data:/data
    restart: unless-stopped
    depends_on:
      - prometheus

  # HTTPS front door for the UI/API (mirrors the nazu stack's tls profile).
  # Certs are user-provided absolute host paths, mirrored into the container
  # so the path is valid as-is. The :- defaults keep compose parseable when
  # tls is unconfigured. Enable with COMPOSE_PROFILES=tls in .env.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      # HTTP→HTTPS redirect. Override when :80 is taken on a shared host —
      # a failed port bind aborts the whole `up`.
      - "${BACKPLANE_HTTP_PORT:-80}:80"
      # Mirrored (host port = container port): the Caddyfile site address
      # includes BACKPLANE_HTTPS_PORT so redirect Locations stay correct on
      # non-standard ports.
      - "${BACKPLANE_HTTPS_PORT:-443}:${BACKPLANE_HTTPS_PORT:-443}"
    environment:
      BACKPLANE_HOSTNAME: ${BACKPLANE_HOSTNAME:-}
      BACKPLANE_HTTPS_PORT: ${BACKPLANE_HTTPS_PORT:-443}
      BACKPLANE_TLS_CERT: ${BACKPLANE_TLS_CERT:-}
      BACKPLANE_TLS_KEY: ${BACKPLANE_TLS_KEY:-}
    command:
      - sh
      - -c
      - |
        : "$${BACKPLANE_HOSTNAME:?BACKPLANE_HOSTNAME is required when the tls profile is active}"
        : "$${BACKPLANE_TLS_CERT:?BACKPLANE_TLS_CERT is required when the tls profile is active}"
        : "$${BACKPLANE_TLS_KEY:?BACKPLANE_TLS_KEY is required when the tls profile is active}"
        exec caddy run --config /config/Caddyfile --adapter caddyfile
    volumes:
      - ./caddy/Caddyfile:/config/Caddyfile:ro
      - ${BACKPLANE_TLS_CERT:-/etc/ssl/backplane/cert.pem}:${BACKPLANE_TLS_CERT:-/etc/ssl/backplane/cert.pem}:ro
      - ${BACKPLANE_TLS_KEY:-/etc/ssl/backplane/key.pem}:${BACKPLANE_TLS_KEY:-/etc/ssl/backplane/key.pem}:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - backplane

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Reach targets published on the host (e.g. nazu's caddy metrics port),
    # which live in other compose projects/networks. No-op on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3001:3000"
    environment:
      # Internal-only dev server; keep the default admin/admin login flow.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  backplane_data:
  caddy_data:
  prometheus_data:
  grafana_data:
