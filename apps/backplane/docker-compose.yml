# The backplane's own compose project — deliberately SEPARATE from any stack it
# manages (it can't be updated by the thing it updates). On the server, run it
# from the published image (`just backplane-update`, i.e. pull + up -d); for
# local dev, `just backplane-up` builds from source.
#
# Self-update: the "Update backplane" button in the UI, `POST /api/self/update`,
# or the MCP `self_update` tool — each spawns a detached helper container that
# pulls + `up -d`'s this stack from outside, so it survives the backplane's own
# recreation. `just backplane-update` / re-running install.sh still work too.
services:
  backplane:
    image: ghcr.io/nazuraki/nazu-backplane:latest
    build:
      context: ../..
      dockerfile: apps/backplane/Dockerfile
    # Loopback-only: plain HTTP stays available on the host for local dev.
    # LAN clients come in through the shared edge (switchboard), which reaches
    # `backplane:8430` over the external `edge` network — see
    # docker-compose.edge.yml.
    ports:
      - "127.0.0.1:8430:8430"
    environment:
      # Static bearer key for agents/MCP (and the break-glass path when usr is
      # down). The API is open only when this AND BACKPLANE_USR_URL are empty.
      BACKPLANE_API_KEY: ${BACKPLANE_API_KEY:-}
      # Public base URL of usr (e.g. https://usr.<parent domain>). Set it and
      # browsers authenticate with usr's cross-app SSO cookie (`nz_id`, verified
      # against usr's JWKS); access requires a role in the `backplane` app
      # (override the app key with BACKPLANE_USR_APP). Empty = no browser auth.
      BACKPLANE_USR_URL: ${BACKPLANE_USR_URL:-}
      BACKPLANE_USR_APP: ${BACKPLANE_USR_APP:-}
      # Image digest poll interval in seconds; 0 disables the poller.
      BACKPLANE_POLL_INTERVAL: ${BACKPLANE_POLL_INTERVAL:-300}
      # Optional GitHub PAT (repo read + read:packages) enabling private git
      # repos and private GHCR images. Empty = public-only, as before.
      BACKPLANE_GITHUB_TOKEN: ${BACKPLANE_GITHUB_TOKEN:-}
      PROMETHEUS_URL: http://prometheus:9090
      # Root of the per-project deploy checkouts (see the workdirs mount below).
      BACKPLANE_WORKDIRS: ${BACKPLANE_WORKDIRS:-${PWD}/workdirs}
    volumes:
      # Read-write: the backplane starts/stops containers in target stacks.
      - /var/run/docker.sock:/var/run/docker.sock
      # Registry DB + generated docker registry-auth config.
      - backplane_data:/data
      # Per-project git checkouts, bind-mounted at the IDENTICAL path inside
      # the container. The backplane runs `docker compose` in these checkouts
      # against the host daemon, so relative bind mounts in managed compose
      # files (e.g. nazu's ./docker-compose.yml self-mount) must resolve to paths the daemon can
      # see — mirroring makes every container-side path a valid host path
      # (same trick as the self-update helper). See ADR 0005. install.sh pins
      # BACKPLANE_WORKDIRS in .env; the ${PWD} fallback covers `just
      # backplane-up` from a checkout.
      - ${BACKPLANE_WORKDIRS:-${PWD}/workdirs}:${BACKPLANE_WORKDIRS:-${PWD}/workdirs}
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    # Loopback-only: LAN access goes through the shared edge (switchboard).
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    # Loopback-only: LAN access goes through the shared edge (switchboard).
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Internal-only dev server; keep the default admin/admin login flow.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  backplane_data:
  prometheus_data:
  grafana_data:
