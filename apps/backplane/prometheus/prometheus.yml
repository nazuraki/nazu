global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container CPU/mem for every container on the host (all compose projects).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # nazu's caddy exposes request-rate/latency metrics on host port 2020 when its
  # tls profile is active. Best-effort: the target is simply down otherwise.
  - job_name: caddy
    static_configs:
      - targets: ["host.docker.internal:2020"]
