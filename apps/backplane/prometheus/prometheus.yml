global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container CPU/mem for every container on the host (all compose projects).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # The switchboard Caddy (shared edge) serves request-rate/latency metrics on
  # its plain-HTTP :2020 listener, reached over the shared `edge` network (see
  # docker-compose.edge.yml). Best-effort: the target is simply down on hosts
  # without the edge stack (e.g. local dev).
  - job_name: caddy
    static_configs:
      - targets: ["switchboard:2020"]
