services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  web:
    # Published by CI (publish-images.yml). `build:` is kept for local dev —
    # plain `up` pulls this image; `up --build` / `just reup` builds from source.
    image: ghcr.io/nazuraki/nazu-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Loopback-only: plain HTTP stays available on the host for local dev.
    # LAN/public clients come in through the shared edge (switchboard), which
    # reaches `web:3000` over the external `edge` network — see
    # docker-compose.edge.yml.
    ports:
      - "127.0.0.1:8420:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Pin the project name so the in-container compose CLI targets the same
      # project/network as the host.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nazu}
      # Static API key(s) for non-interactive agents / the Memory MCP. Off when
      # empty. Also loadable from .env; surfaced here so `NAZU_API_KEY=… up` works.
      NAZU_API_KEY: ${NAZU_API_KEY:-}
      # Graphiti temporal-graph sidecar (#53). Compose-internal; the web app
      # passes credentials per request, so no secret env is needed here.
      GRAPHITI_URL: ${GRAPHITI_URL:-http://graphiti:8000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Lets the web app drive `docker compose` to toggle optional services.
      # Service secrets live in DB settings, so no host .env file is needed.
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      falkordb:
        condition: service_started

  # Temporal-knowledge recall (#53): thin FastAPI wrapper over graphiti-core.
  # Stateless about secrets — the web app passes the Anthropic key + embedder
  # config per request. Entity extraction embeds via a local, OpenAI-compatible
  # endpoint (Ollama on the host by default).
  graphiti:
    # Opt-in: off by default and excluded from the test stack (which activates no
    # profiles), so the heavy Python image only builds when graph recall is used.
    # Start it via the in-app "Optional services" toggle or
    # `docker compose --profile graph up -d graphiti`.
    profiles: ["graph"]
    # Published image so the in-app services toggle (which has no build context
    # inside the web container) and server deploys can pull instead of building.
    image: ghcr.io/nazuraki/nazu-graphiti:latest
    build:
      context: ./apps/graphiti
      dockerfile: Dockerfile
    environment:
      FALKORDB_ADDR: ${FALKORDB_ADDR:-falkordb:6379}
      GRAPHITI_GRAPH: ${GRAPHITI_GRAPH:-nazu_knowledge}
      EMBEDDER_BASE_URL: ${EMBEDDER_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-nomic-embed-text}
    # Lets the container reach a host-run Ollama on Linux (no-op on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # /health needs no LLM/embedder/graph connectivity — it confirms the app
    # booted. Uses python (the slim image has no curl). Lets `up --wait` gate.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_started

  # Discord ingest bot (#34): watches configured channels for YouTube/TikTok
  # links and ingests their transcripts via the web app's /api/ingest/url. Thin
  # sidecar — all app config (bot token, channels, enabled flag) is DB-backed and
  # fetched from the web app at runtime; only the bootstrap URL + API key are env.
  discord:
    # Opt-in: off by default and excluded from the test stack. Start it via the
    # in-app "Optional services" toggle or
    # `docker compose --profile discord up -d discord`.
    profiles: ["discord"]
    # Published image so the in-app services toggle (which has no build context
    # inside the web container) and server deploys can pull instead of building.
    image: ghcr.io/nazuraki/nazu-discord:latest
    build:
      context: .
      dockerfile: apps/discord/Dockerfile
    environment:
      NAZU_URL: ${NAZU_URL_INTERNAL:-http://web:3000}
      # Same static key the web app accepts; empty in zero-conf open mode.
      NAZU_API_KEY: ${NAZU_API_KEY:-}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nazu
      POSTGRES_PASSWORD: nazu
      POSTGRES_DB: nazu
    volumes:
      # postgres:18+ stores data in a version-specific subdir, so the volume is
      # mounted at the parent (/var/lib/postgresql), not /…/data as on ≤16.
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"
      - "7688:7687"
    volumes:
      - falkordb_data:/data
    command:
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    restart: unless-stopped

volumes:
  postgres_data:
  falkordb_data:
  minio_data:
