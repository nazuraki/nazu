services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - web

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "443:443"
    environment:
      NAZU_HOSTNAME: ${NAZU_HOSTNAME:-}
      NAZU_TLS_CERT: ${NAZU_TLS_CERT:-}
      NAZU_TLS_KEY: ${NAZU_TLS_KEY:-}
    command:
      - sh
      - -c
      - |
        : "$${NAZU_HOSTNAME:?NAZU_HOSTNAME is required when the tls profile is active}"
        : "$${NAZU_TLS_CERT:?NAZU_TLS_CERT is required when the tls profile is active}"
        : "$${NAZU_TLS_KEY:?NAZU_TLS_KEY is required when the tls profile is active}"
        exec caddy run --config /config/Caddyfile --adapter caddyfile
    # The web app writes the generated Caddyfile into the shared caddy_config
    # volume; caddy reads it from there (no host path, no env needed). Certs are
    # user-provided absolute host paths, mirrored so the path is valid as-is.
    # The :- defaults keep `compose` parseable when tls is unconfigured (caddy
    # is only ever started once certs are set and validated by the web app).
    volumes:
      - caddy_config:/config:ro
      - ${NAZU_TLS_CERT:-/etc/ssl/nazu/cert.pem}:${NAZU_TLS_CERT:-/etc/ssl/nazu/cert.pem}:ro
      - ${NAZU_TLS_KEY:-/etc/ssl/nazu/key.pem}:${NAZU_TLS_KEY:-/etc/ssl/nazu/key.pem}:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - web

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Host port 8420 → container 3000. The internal port stays 3000 so caddy /
    # cloudflared (same docker network) keep reaching `web:3000` unchanged.
    ports:
      - "8420:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Pin the project name so the in-container compose CLI targets the same
      # project/network as the host — required for caddy's `web:3000` to resolve.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nazu}
      # Static API key(s) for non-interactive agents / the Memory MCP. Off when
      # empty. Also loadable from .env; surfaced here so `NAZU_API_KEY=… up` works.
      NAZU_API_KEY: ${NAZU_API_KEY:-}
      # Graphiti temporal-graph sidecar (#53). Compose-internal; the web app
      # passes credentials per request, so no secret env is needed here.
      GRAPHITI_URL: ${GRAPHITI_URL:-http://graphiti:8000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Lets the web app drive `docker compose` to toggle optional services.
      # Secrets (e.g. the CF tunnel token) are injected into that subprocess from
      # DB settings, so no host .env file is needed.
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # Shared with caddy: the web app writes the generated Caddyfile here when
      # tls is enabled. Named volume — no host path, works without config.
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      falkordb:
        condition: service_started

  # Temporal-knowledge recall (#53): thin FastAPI wrapper over graphiti-core.
  # Stateless about secrets — the web app passes the Anthropic key + embedder
  # config per request. Entity extraction embeds via a local, OpenAI-compatible
  # endpoint (Ollama on the host by default).
  graphiti:
    # Opt-in: off by default and excluded from the test stack (which activates no
    # profiles), so the heavy Python image only builds when graph recall is used.
    # Start it via the in-app "Optional services" toggle or
    # `docker compose --profile graph up -d graphiti`.
    profiles: ["graph"]
    build:
      context: ./apps/graphiti
      dockerfile: Dockerfile
    environment:
      FALKORDB_ADDR: ${FALKORDB_ADDR:-falkordb:6379}
      GRAPHITI_GRAPH: ${GRAPHITI_GRAPH:-nazu_knowledge}
      EMBEDDER_BASE_URL: ${EMBEDDER_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-nomic-embed-text}
    # Lets the container reach a host-run Ollama on Linux (no-op on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nazu
      POSTGRES_PASSWORD: nazu
      POSTGRES_DB: nazu
    volumes:
      # postgres:18+ stores data in a version-specific subdir, so the volume is
      # mounted at the parent (/var/lib/postgresql), not /…/data as on ≤16.
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"
      - "7688:7687"
    volumes:
      - falkordb_data:/data
    command:
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    restart: unless-stopped

volumes:
  postgres_data:
  falkordb_data:
  caddy_data:
  caddy_config:
  minio_data:
